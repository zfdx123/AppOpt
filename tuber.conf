# tuber.conf — AppOpt SoC 优化配置 v1.0
#
# 亮屏/息屏自动切换，温控联动 abk_soc_opt 内核模块
# 命令行参数可覆盖以下任意值 (优先级: 命令行 > 配置文件 > 默认值)

[app]
# 进程扫描间隔(秒), 轻载时可设 5-10
sleep_interval = 2

# 频率写入间隔(秒)
# freq_interval    = 无内核模块时的间隔 (默认 4, 对抗 perfd)
# freq_interval_kmod = 有内核模块时的间隔 (默认 30, 内核模块自己维持)
# 息屏时自动 x2
freq_interval = 4
freq_interval_kmod = 30

[power]
# 启用功耗优化: 前台→little+mid+big, 后台→little+mid, 超温→little
enabled = true

# 温控触发温度 (毫摄氏度), 75000 = 75°C
# 注意: read_thermal_max() 取的是全部 thermal_zone 里最热的那个（含 gpuss/battery/
# pa_therm 等）。原先设备上被改成 95000，而 CPU 一级降频 trip 点本身就是 95°C，
# 等于温控永不抢先介入，属于无效配置。
temp_limit_mc = 75000

[freq_on]
# 亮屏时 per-cluster 频率上限 (kHz)
# 顺序: little → mid → big → prime
# 0 = 不限制该 cluster
#
# 本机硬件上限: 2265600 / 3148800 / 2956800 / 3302400
# 原先设备上被抬到 2300000,3100000,3100000,3200000，几乎等于不限制，
# 日常功耗上限被完全放开。这里回调到留出余量的档位。
limits = 2000000,2200000,2600000,2800000

# 内核模块轮询周期 (ms), 0 = 纯 notifier (推荐)
poll_ms = 0

[freq_off]
# 息屏时 per-cluster 频率上限, 可设为更低值或 0 来离线核心
limits = 1000000,1200000,1200000,1200000

# 息屏后延迟 N 秒才切换, 避免短暂黑屏卡顿 (默认 180 = 3分钟)
delay_sec = 180

# 息屏时内核轮询周期 (ms), 可设大一些省电
poll_ms = 10000

# 息屏时 AppOpt 进程扫描间隔 (秒), 后台不需要频繁扫
sleep_interval = 10

# 息屏时频率写入间隔 (秒)
freq_interval = 8
freq_interval_kmod = 60

[thermal]
# 超温时 per-cluster 频率上限 (优先级最高)
limits = 1200000,1500000,1500000,1500000