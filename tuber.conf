# tuber.conf — AppOpt SoC 优化配置 v1.0
#
# 亮屏/息屏自动切换，温控联动 abk_soc_opt 内核模块
# 命令行参数可覆盖以下任意值 (优先级: 命令行 > 配置文件 > 默认值)

[app]
# 进程扫描间隔(秒), 轻载时可设 5-10
sleep_interval = 2

[power]
# 启用功耗优化: 前台→little+mid+big, 后台→little+mid, 超温→little
enabled = true

# 温控触发温度 (毫摄氏度), 默认 75000 = 75°C
temp_limit_mc = 75000

[freq_on]
# 亮屏时 per-cluster 频率上限 (kHz)
# 顺序: little → mid → big → prime
# 0 = 不限制该 cluster
limits = 2000000,2200000,2600000,2800000

# 内核模块轮询周期 (ms), 0 = 纯 notifier (推荐)
poll_ms = 0

[freq_off]
# 息屏时 per-cluster 频率上限, 可设为更低值或 0 来离线核心
limits = 1000000,1200000,1200000,1200000

# 息屏后延迟 N 秒才切换, 避免短暂黑屏卡顿 (默认 180 = 3分钟)
delay_sec = 180

# 息屏时内核轮询周期 (ms), 可设大一些省电
poll_ms = 10000

# 息屏时 AppOpt 进程扫描间隔 (秒), 后台不需要频繁扫
sleep_interval = 10

[thermal]
# 超温时 per-cluster 频率上限 (优先级最高)
limits = 1200000,1500000,1500000,1500000
